# =============================================================================
# PRODUCTION overrides - activate with:  SPRING_PROFILES_ACTIVE=prod
# (Render: set as an env var.  AWS: task definition / Elastic Beanstalk env.)
# All secrets MUST come from the environment; there are deliberately no defaults here.
# =============================================================================
# e.g. jdbc:postgresql://<rds-endpoint>:5432/proptech?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

proptech.jwt.secret=${JWT_SECRET}
proptech.escrow.otp-pepper=${OTP_PEPPER}
proptech.kyc.nin-pepper=${NIN_PEPPER}

# https://api.yourdomain.com  (the AI service must be able to reach it, or point at S3/CDN URLs instead)
proptech.storage.public-base-url=${PUBLIC_BASE_URL}
proptech.ai.base-url=${AI_BASE_URL}

# Your Vercel domain(s)
proptech.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Render/most PaaS terminate TLS in front of the app and forward the original scheme.
server.forward-headers-strategy=framework
server.port=${PORT:8080}
