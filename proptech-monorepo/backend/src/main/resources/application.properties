# =============================================================================
# NaijaProptech API - LOCAL profile (default)
# PostgreSQL runs on 127.0.0.1:5432 next to WAMP/XAMPP (MySQL 3306, Apache 80/443 - no clashes).
# Every value can be overridden by an environment variable, which is how the
# same jar runs on Render / AWS with no code changes (see application-prod.properties).
# =============================================================================
spring.application.name=proptech-api
server.port=${SERVER_PORT:8080}

# ---- PostgreSQL (localhost) --------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/proptech}
spring.datasource.username=${DB_USERNAME:proptech_app}
spring.datasource.password=${DB_PASSWORD:proptech_dev_pw}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000

# ---- JPA / Hibernate ---------------------------------------------------------
# The schema is owned by database/init.sql, so Hibernate must not touch it.
# After confirming your DB matches, "validate" is a good stricter setting for CI.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=32
# Dialect is auto-detected (PostgreSQL); hibernate-spatial registers the PostGIS functions itself.

# ---- Uploads -----------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ---- Actuator (health probe only) --------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# =============================================================================
# Application settings (bound to ng.proptech.config.AppProperties)
# =============================================================================
# JWT: HS256 needs >= 32 bytes. NEVER ship this default; set JWT_SECRET in production.
proptech.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
proptech.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:720}

# Python AI microservice (FastAPI) on its own local port
proptech.ai.base-url=${AI_BASE_URL:http://127.0.0.1:8000}
# Cosine distance below this => "same room" => duplicate
proptech.ai.duplicate-distance-threshold=${AI_DUPLICATE_THRESHOLD:0.15}
proptech.ai.connect-timeout-ms=3000
proptech.ai.read-timeout-ms=15000

# Public images are served at /media/**; private (NIN slips) are never exposed over HTTP.
proptech.storage.upload-dir=${UPLOAD_DIR:./uploads}
# The URL the AI service uses to download images we just stored (must be reachable FROM the AI service).
proptech.storage.public-base-url=${PUBLIC_BASE_URL:http://127.0.0.1:8080}

# Browser origins allowed to call the API directly (the Next.js proxy makes this rarely needed).
proptech.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Escrow money rules
proptech.fees.platform-percent=3.0
proptech.fees.logistics-flat=5000
proptech.escrow.otp-pepper=${OTP_PEPPER:local-dev-otp-pepper-change-me}
proptech.escrow.max-otp-attempts=5
proptech.escrow.otp-validity-hours=168

# NIN numbers are stored only as HMAC hashes using this pepper.
proptech.kyc.nin-pepper=${NIN_PEPPER:local-dev-nin-pepper-change-me}
